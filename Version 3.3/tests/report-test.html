<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Module Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <h1>Professional Report Generation Test</h1>
    <div id="status">Loading modules...</div>
    <button id="testBtn" onclick="testReportGeneration()" disabled>Test Report Generation</button>
    <div id="results"></div>

    <!-- Load report modules -->
    <script src="../js/reports/pdfGenerator.js"></script>
    <script src="../js/reports/coverPage.js"></script>
    <script src="../js/reports/tableOfContents.js"></script>
    <script src="../js/reports/executiveSummary.js"></script>
    <script src="../js/reports/equipmentSchedule.js"></script>
    <script src="../js/reports/calculationSheets.js"></script>
    <script src="../js/reports/revisionHistory.js"></script>
    <script src="../js/reports/assumptionsPage.js"></script>
    <script src="../js/reports/standardsReference.js"></script>
    <script src="../js/reports/reportOrchestrator.js"></script>

    <script>
        // Simple test
        window.addEventListener('load', function() {
            const status = document.getElementById('status');
            const testBtn = document.getElementById('testBtn');
            const results = document.getElementById('results');
            
            // Check if all modules loaded
            const modules = [
                'ProfessionalPDFGenerator',
                'CoverPageGenerator',
                'TableOfContentsGenerator',
                'ExecutiveSummaryGenerator',
                'EquipmentScheduleGenerator',
                'CalculationSheetsFormatter',
                'RevisionHistoryManager',
                'AssumptionsPageGenerator',
                'StandardsReferenceGenerator',
                'ReportOrchestrator'
            ];
            
            let allLoaded = true;
            let report = '<h2>Module Load Status:</h2><ul>';
            
            modules.forEach(module => {
                const loaded = typeof window[module] !== 'undefined';
                allLoaded = allLoaded && loaded;
                report += `<li>${module}: <strong>${loaded ? '✅ Loaded' : '❌ Failed'}</strong></li>`;
            });
            
            report += '</ul>';
            results.innerHTML = report;
            
            if (allLoaded) {
                status.textContent = '✅ All modules loaded successfully!';
                status.style.color = 'green';
                testBtn.disabled = false;
            } else {
                status.textContent = '❌ Some modules failed to load';
                status.style.color = 'red';
            }
        });
        
        function testReportGeneration() {
            try {
                // Create simple test data
                const testData = {
                    projectName: 'Test Project',
                    docNumber: 'TEST-001',
                    docRevision: '0',
                    buses: [
                        {
                            id: 'BUS-001',
                            name: 'Main Distribution Panel',
                            voltage: 480,
                            aic: 65,
                            results: {
                                fault3Phase: 45.5,
                                faultLG: 38.2,
                                voltageDrop: 2.1,
                                incidentEnergy: 8.5,
                                ppeCategory: 2
                            }
                        }
                    ]
                };
                
                // Test PDF generator
                const pdfGen = new ProfessionalPDFGenerator(testData);
                
                // Add a test page
                pdfGen.newPage('TEST PAGE', 'Testing');
                pdfGen.addSectionTitle('Test Section', 1);
                pdfGen.addText('This is a test report generated by the professional report system.');
                
                // Generate PDF
                pdfGen.save('test-report.pdf');
                
                alert('✅ Test report generated successfully! Check your downloads folder for test-report.pdf');
            } catch (error) {
                alert('❌ Error generating test report: ' + error.message);
                console.error(error);
            }
        }
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            color: #667eea;
        }
        #status {
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 20px 0;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        button:not(:disabled):hover {
            background: #5568d3;
        }
        #results ul {
            list-style: none;
            padding: 0;
        }
        #results li {
            padding: 8px;
            margin: 5px 0;
            background: #f5f5f5;
            border-left: 4px solid #667eea;
        }
    </style>
</body>
</html>
